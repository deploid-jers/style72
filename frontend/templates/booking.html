{% extends 'base.html' %}
{% block title %}Запись - Estetica Lab{% endblock %}

{% block content %}


    <div class="page-header">
        <div class="container">
            <h1>Онлайн-запись</h1>
        </div>
    </div>

    <section>
        <div class="container form-container">
            <h2 style="text-align: center; margin-bottom: 20px;">Записаться на прием</h2>
            <form class="form">
                <input type="text" placeholder="ФИО *" required>
                <input type="tel" placeholder="Номер телефона *" required>
                <select required>
                    <option value="" disabled selected>Выберите направление *</option>
                    <option value="derm">Дерматология / Трихология</option>
                    <option value="app">Аппаратная косметология</option>
                    <option value="est">Эстетическая косметология</option>
                    <option value="inj">Инъекционная косметология</option>
                </select>
                <input type="date" required>
                <label class="checkbox-label">
                    <input type="checkbox" required> Согласен с политикой обработки персональных данных
                </label>
                <button type="submit" class="btn btn-primary btn-large">Подтвердить запись</button>
            </form>
        </div>
    </section>

{% endblock %}
